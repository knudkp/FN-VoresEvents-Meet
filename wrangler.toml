name = "fn-voresevents-meet-2026"
main = "./build/index.js"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[site]
bucket = "./public"

[vars]
CALLS_APP_ID = "a96d4f51bcee567d7684c7367d835e9b"

[[durable_objects.bindings]]
name = "rooms"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# The necessary secrets are:
# - CALLS_APP_SECRET
# - HOST_PASSWORD (optional — required only to enable host features)
# Set these in the Cloudflare dashboard (Workers & Pages > this worker >
# Settings > Variables and Secrets), or run:
# echo <VALUE> | wrangler secret put <NAME>
