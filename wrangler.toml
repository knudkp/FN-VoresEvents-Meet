name = "fn-voresevents-meet-2026"
main = "./build/index.js"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[site]
bucket = "./public"

[vars]
CALLS_APP_ID = "a96d4f51bcee567d7684c7367d835e9b"

[[durable_objects.bindings]]
name = "rooms"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# No D1 database is bound yet, so meeting stats, per-meeting host
# passwords, chat history and the admin action log are all inactive
# (the app still works fine without this — HOST_PASSWORD alone is
# enough for host features). To enable them:
#   1. wrangler d1 create fn-voresevents-meet-db
#   2. paste the database_id it prints below
#   3. npm run db:migrate
#
# [[d1_databases]]
# binding = "DB"
# database_name = "fn-voresevents-meet-db"
# database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# The necessary secrets are:
# - CALLS_APP_SECRET
# - HOST_PASSWORD (optional — a master password that can claim host in
#   any room; without it, host features still work via the per-meeting
#   password set by whoever first claims host, once DB is bound above)
# Set these in the Cloudflare dashboard (Workers & Pages > this worker >
# Settings > Variables and Secrets), or run:
# echo <VALUE> | wrangler secret put <NAME>
