name = "fn-voresevents-meet-2026"
main = "./build/index.js"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[site]
bucket = "./public"

[vars]
CALLS_APP_ID = "a96d4f51bcee567d7684c7367d835e9b"

[[durable_objects.bindings]]
name = "rooms"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[d1_databases]]
binding = "DB"
database_name = "fn-voresevents-meet-db"
database_id = "5d79df48-5696-4fb0-84cc-a1f724816e99"

# The necessary secrets are:
# - CALLS_APP_SECRET
# - ADMIN_USERNAME (required to enable host features and /admin —
#   "Bliv vært" and admin login both need this username plus a password)
# - HOST_PASSWORD (optional — a master password that can claim host in
#   any room and log into /admin; without it, host features still work
#   via the per-meeting password set by whoever first claims host, once
#   DB is bound above, but /admin login requires this to be set)
# - RESEND_API_KEY (optional — sends user-account "set your password"
#   invite emails via resend.com; without it, invite links show in the
#   admin dashboard for sending manually)
# - RESEND_FROM_EMAIL (optional — only needed if you've verified your
#   own sending domain in Resend; otherwise a shared test address is used)
# Set these in the Cloudflare dashboard (Workers & Pages > this worker >
# Settings > Variables and Secrets), or run:
# echo <VALUE> | wrangler secret put <NAME>
